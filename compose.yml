services:

  mysql:
    image: mysql:8.0
    container_name: dsms-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: dsms_db
      MYSQL_USER: dsms_app
      MYSQL_PASSWORD: dsms_password
      MYSQL_ROOT_PASSWORD: root_password

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: dsms-app
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      DB_USERNAME: dsms_app
      DB_PASSWORD: dsms_password
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/dsms_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Phnom_Penh

    ports:
      - "8081:8081"

  nginx:
    image: nginx:alpine
    container_name: dsms-nginx
    restart: unless-stopped

    depends_on:
      - app

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  mysql_data: